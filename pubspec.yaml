name: nexora_ai_app
description: "Nexora Mobile - High-performance Flutter AI Multi-Agent Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Dependency Injection & Service Locator
  get_it: ^8.0.3

  # Networking & HTTP
  dio: ^5.8.0+1
  http_parser: ^4.1.2

  # Local Storage & Security
  flutter_secure_storage: 11.2.0
  shared_preferences: ^2.5.2

  # Rich Rendering & Media
  flutter_markdown: ^0.7.6+1
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  flutter_highlight: ^0.7.0
  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  youtube_player_flutter: 10.0.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  file_picker: 13.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
